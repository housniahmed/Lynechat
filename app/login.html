<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Connexion — Lynechat</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="vendor/fonts/inter/400.css" />
  <link rel="stylesheet" href="vendor/fonts/inter/600.css" />
  <link rel="stylesheet" href="vendor/fonts/inter/700.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="login-body">
  <form class="login-card" id="f">
    <div class="brand"><img src="assets/icon.png" alt="" /><span>Lynechat</span></div>
    <label class="f">Mot de passe
      <input type="password" id="pw" autocomplete="current-password" autofocus required />
    </label>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center">Se connecter</button>
    <p id="err" class="note err" hidden></p>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
